<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="kkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F5C57" />
      <stop offset="100%" stop-color="#2A7973" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1F5C57" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Kanyakumari District Geographic Peninsula Contour -->
  <path d="M 28 22 
           C 36 18, 55 16, 72 20 
           C 78 28, 80 38, 76 48 
           C 72 58, 64 68, 56 78 
           C 52 83, 50 88, 50 92 
           C 50 88, 46 82, 40 74 
           C 32 64, 22 52, 20 40 
           C 18 30, 22 24, 28 22 Z" 
        fill="url(#kkGrad)" 
        stroke="#1F5C57" 
        stroke-width="2" 
        filter="url(#subtleGlow)" />
        
  <!-- Three Seas Confluence Apex Dot (Cape Comorin / Kanyakumari Point) -->
  <circle cx="50" cy="92" r="3.5" fill="#EBE6DC" stroke="#1F5C57" stroke-width="1.8" />
  
  <!-- Internal Constellation Node Accent -->
  <circle cx="48" cy="46" r="2.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="38" cy="36" r="1.8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="62" cy="38" r="1.8" fill="#FFFFFF" opacity="0.8" />
  <circle cx="50" cy="68" r="1.8" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Edge connections -->
  <line x1="48" y1="46" x2="38" y2="36" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6" />
  <line x1="48" y1="46" x2="62" y2="38" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6" />
  <line x1="48" y1="46" x2="50" y2="68" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6" />
  <line x1="50" y1="68" x2="50" y2="92" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.7" />
